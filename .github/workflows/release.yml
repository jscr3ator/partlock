# Publishes the prebuilt Windows app in release/ as a GitHub release, tagged with the
# <Version> from src/PartLock/PartLock.csproj, then builds the macOS app on a Mac runner and
# adds PartLock.dmg + PartLock-mac.zip to the same release. Re-running replaces that release's files
# (same version = no update prompt for anyone).
name: Publish release

on:
  push:
    paths:
      - "release/**"
      - "src/PartLock.Mac/**"
      - "src/PartLock/Core/**"
      - "src/PartLock/Platform/TeamNotify.cs"
      - "src/PartLock/Platform/SolidWorksRefs.cs"
      - "mac/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        id: pkg
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PartLock/PartLock.csproj)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          dir="PartLock-v$version"
          mkdir -p "dist/$dir"
          cp release/PartLock.exe release/PartLock.exe.config docs/TEAM-GUIDE.md docs/ADMIN-SETUP.md "dist/$dir/"
          (cd dist && zip -r "$dir.zip" "$dir")
          echo "zip=dist/$dir.zip" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          files="$ZIP release/PartLock.exe release/PartLock.exe.config"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "PartLock $TAG" --notes-file release/RELEASE-NOTES.md --latest
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "PartLock $TAG" \
              --notes-file release/RELEASE-NOTES.md --target "$GITHUB_SHA" --latest
          fi

  mac:
    needs: publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build PartLock for macOS
        run: ./mac/build-mac.sh

      - name: Add the Mac files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PartLock/PartLock.csproj | head -1)
          gh release upload "v$version" mac-dist/PartLock.dmg mac-dist/PartLock-mac.zip --clobber

      - name: Keep the smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-smoke-test
          path: mac-dist/smoke-test.png
          if-no-files-found: ignore
